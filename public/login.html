<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">    
    <title>Mini-NVR System Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f3f4f6;
        }

        .login-card {
            width: 320px;
            padding: 24px;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 18px;
            font-size: 22px;
            text-align: center;
        }

        label {
            display: block;
            margin: 12px 0 4px;
            font-size: 14px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            border: none;
            border-radius: 3px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h1>Login</h1>
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Enter username" autocomplete="username" />
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" />
        <button id="loginButton" type="button">Login</button>
    </div>

    <script>

        const AUTH_SERVICE_URL = window.location.origin;
        async function login(username, password) {
            try {
                const response = await fetch(`${AUTH_SERVICE_URL}/login`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json" },
                    body: JSON.stringify({username, password})
                });

                if (response.status === 401) {
                    return {success: false, error: "INVALID_CREDENTIALS"};
                }

                if (!response.ok) { 
                    return {success: false, error: `HTTP_${response.status}`};
                }

                const data = await response.json();
                sessionStorage.setItem("auth", JSON.stringify(data));

                return { success: true, data: JSON.stringify(data)};

            } catch (error) {
                return { success: false, error: "NETWORK_ERROR", message: error.message };
            }
        }

        //-----------------------------------------------------------------------------------------
        document.getElementById('loginButton').addEventListener('click', function () {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!username || !password) {
                alert('Please enter both username and password.');
                return;
            }
            login(username, password).then(result => {
                if (result.success) {
                    let token = JSON.parse(result.data).token;
                    //console.log("token: " + token);
                    window.location.href = '/public/index.html?token=' + token;
                } else {
                    alert(`Login failed: ${result.error}`);
                }
            });
        });

        if (sessionStorage.getItem("auth") !== null)
            sessionStorage.removeItem("auth");
        
    </script>
</body>

</html>
