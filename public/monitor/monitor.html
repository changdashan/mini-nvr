	<script type="text/javascript">

        let videoLiveViewMore = VideoLiveViewMore;

        jQuery( async function ($) {
            const isCompactLayout = window.matchMedia(
                '(max-width: 600px), (orientation: landscape) and (max-height: 500px)'
            ).matches;

            $('#monitor_panels').split({
                orientation: 'vertical',
                minSize: 200,
                handle: 'default',
                position: isCompactLayout ? '50%' : 640,
            });

            $('#eventview_panels').split({
                orientation: 'horizontal',
                minSize: 150,
                handle: 'default',
                position: 150,
            });

            let eventcount = 0;
            const playbackDiv = document.getElementById("playbackDiv");
            const video_showrecording = document.getElementById('videoShowRecording');
            const imgShowSnapshot = document.getElementById('imgShowSnapshot');
            video_showrecording.style.display = "none";
            //playbackDiv.style.display = "none";
            //imgShowSnapshot.style.display = "none";

            let snapshotIconsDiv = $('#snapshotIcons');
            // Connect to a secure WebSocket endpoint
            const token = await ensureAuthToken(); // Assume this function retrieves the auth token
            if (!token) {
                console.error("Auth token is missing. Cannot establish WebSocket connection.");
                return;
            }
            const socket = new WebSocket(`${getWebSocketUrl_2(token, "anycamera")}/event`);

            // 1. Connection opened
            socket.addEventListener("open", (event) => {
                console.log("Secure connection established.");
                socket.send(JSON.stringify({ type: "greeting", payload: "Hello Server!" }));
            });

            // 2. Listen for incoming messages
            socket.addEventListener("message", (event) => {
                try {

                    const data = JSON.parse(event.data);
                    //console.log("Message from server:", data);
                    //const timestamp = new Date().toLocaleString();

                    const clipname = data.filename;
                    const clipurl = '/' + data.relativePath; 
                    const snapshot_url = clipurl.replaceAll(".mp4", ".jpg");
                    const timestamp = data.timestamp;
                    const status = data.status;
                    if (status === 'eventtriggered'){
                        startFlash();
                        const url = new URL(snapshot_url, window.location.origin);                                  
                        videoLiveViewMore.playRecordedClip(url.pathname);
                        return;
                    }                    

                    let imgTag = `<img src='${snapshot_url}' width='160' height='90' style='margin:1px'/><br/><span style='font-size:10px;'>${timestamp}</span>`;
       
                    let htmlstr = `<a href='${clipurl}' onclick='videoLiveViewMore.playbackclip(event)' data-timestamp='${timestamp}'>${imgTag}</a>`;

                    snapshotIconsDiv.append(htmlstr);

                    eventcount ++;
                    let event_cnt = document.getElementById('eventcount');
                    event_cnt.innerText = eventcount;
                    stopFlash();

                    setTimeout(() => {
                        snapshotIconsDiv.find('a').last()[0].click();
                    }, 1000 );

                } catch (err) {
                    console.log("Error occurred:", err);
                }
            });

            // 3. Handle connection errors
            socket.addEventListener("error", (event) => {
                console.error("WebSocket error observed:", event);
            });

            // 4. Connection closed
            socket.addEventListener("close", (event) => {
                console.log(`Connection closed (Code: ${event.code})`);
            });

        });

        //let videoLiveViewMore = VideoLiveViewMore;
		//-----------------------------------------------------------------------------------------
		async function showLiveView(siteId, cameraId, cameraName) {
            console.log("siteId=" + siteId + " cameraId=" + cameraId);

            let cameraSetting;
            try {
                cameraSetting = await loadCamera(siteId, cameraId);
            } catch (error) {
                console.error("Failed to load camera settings; live view was not started.", error);
                alert("Failed to load camera settings. Please try again.");
                return;
            }

            const cameraStreamOptions = {
                ...streamOptions,
                fps: cameraSetting.fps,
                width: cameraSetting.width,
                height: cameraSetting.height,
                b_v: cameraSetting.b_v,
                audio: cameraSetting.audio,
                audioformat: cameraSetting.audioformat,
                player: cameraSetting.player,
                videoformat: cameraSetting.videoformat || 'mpeg1video',
            };

            let playerOptions = {
                dialog_divId:null,
                canvas:null, 
                videoformat:cameraStreamOptions.videoformat, 
                audio:cameraStreamOptions.audio, 
                audioformat:cameraStreamOptions.audioformat, 
                width:cameraStreamOptions.width, 
                height:cameraStreamOptions.height, 
                videoBufferSize:4*1024*1024,
                disableWebAssembly:true,
            }

            let cameraNode = {
                siteId: siteId,
                cameraId: cameraId,
                cameraName: cameraName,
                streamOptions: cameraStreamOptions,
                playerOptions: playerOptions,
            }

            await videoLiveViewMore.ShowLiveViewOfCamera(cameraNode);
		}


        const intervalId = setInterval(()=>{
            const TWO_HOURS_MS = 2 * 60 * 60 * 1000;
            const now = Date.now();            
            let snapshotIconsDiv = $('#snapshotIcons');
            let aLinks = snapshotIconsDiv.find('a');
            aLinks.each((index, link)=>{
                const rawTimestamp = link.getAttribute('data-timestamp');
                const linkTime = new Date(rawTimestamp).getTime();
                if ( ! isNaN(linkTime) && (now - linkTime) > TWO_HOURS_MS){
                    link.remove();
                    console.log('link removed');
                }
            })   
        }, 1000 * 30);

        let flashTimer = null;
        let isVisible = false;

        function startFlash() {
            // Prevent multiple timers
            if (flashTimer !== null) return;

            // Start flashing immediately
            isVisible = true;
            document.getElementById("redDot").style.display = "block";

            flashTimer = setInterval(() => {
                isVisible = !isVisible;

                document.getElementById("redDot").style.display =
                isVisible ? "block" : "none";

            }, 1000);
        }

        function stopFlash() {
            clearInterval(flashTimer);
            flashTimer = null;
            isVisible = false;

            // Show an empty circle
            document.getElementById("redDot").style.display = "none";
        }
