    <!--script src="js/views/liveview.js"></script-->
	<script type="text/javascript" src="../requestauthtoken.js"></script>
	<script type="text/javascript" src="live_view_more.js"></script>    		
	<script type="text/javascript">

        let videoLiveViewMore = VideoLiveViewMore;
		//-----------------------------------------------------------------------------------------
		async function showLiveView(siteId, cameraId, cameraName) {
            console.log("siteId=" + siteId + " cameraId=" + cameraId);
            let cameraNode = {
                siteId: siteId,
                cameraId: cameraId,
                cameraName: cameraName,
                streamOptions: {
                    fps: 25,
                    width: 1280,
                    height: 720,
                    b_v: '2M',
                    audio: false,
                    audioformat:'mp2',
                    //audioformat:'aac',
                    //player:'jsmpeg-h264',               //telling backend what ffmpeg cmd is picked.
                    //videoformat: 'h264',                //telling jsmpeg player what video format the stream is encoded
                    player:'jsmpeg',                  //telling backend what ffmpeg cmd is picked.                
                    videoformat: 'mpeg1video',
                },
            }

            let playerOptions = {
                dialog_divId:null,
                canvas:null, 
                videoformat:cameraNode.streamOptions.videoformat, 
                audio:cameraNode.streamOptions.audio, 
                audioformat:cameraNode.streamOptions.audioformat, 
                width:cameraNode.streamOptions.width, 
                height:cameraNode.streamOptions.height, 
            }

            cameraNode.playerOptions = playerOptions;

            await videoLiveViewMore.ShowLiveViewOfCamera(cameraNode);
		}

	</script>	
	
</head>
<body>
	
	<h3 align="center">Live View Port</h3>
    <div id="nocameramsg"></div>
    <div id="liveview">
    </div>
